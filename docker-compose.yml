# Local equivalent of the Railway Template Composer settings.
# Same image build, volume path, and variable names. Requires
# Docker; the parity test script (scripts/local-test.sh) does not.
services:
  postgres:
    build: .
    container_name: postgres-19-pgvector-parity
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or a local .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-railway}
    ports:
      - "5432:5432"
    volumes:
      - postgres-19-data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres-19-data:
